minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.21"
  - "@expo/fingerprint@0.20.12"
  - "@expo/metro-runtime@57.0.15"
  - "@expo/router-server@57.0.9"
  - "@expo/ui@57.0.15"
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-font@57.0.3
  - expo-image@57.0.4
  - expo-linking@57.0.9
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo-router@57.0.18
  - expo@57.0.19
nodeLinker: hoisted
# react-native-css@3.0.7 declares `lightningcss: ">=1.27.0"` with no upper
# bound. Under `nodeLinker: hoisted`, pnpm hoisted lightningcss@1.33.0 to the
# root, whose @import/Specifier serialization schema no longer matches what
# react-native-css's Metro compiler expects — every native bundle then dies
# with `failed to deserialize; expected an object-like struct named Specifier`.
# Web is unaffected (it goes through @tailwindcss/postcss, not react-native-css),
# which is why this stayed invisible for a long time.
# 1.30.1 is the version @expo/metro-config actually requires and that
# react-native-css's own loader recommends. Note this pins BELOW the 1.32.0
# that @tailwindcss/node@4.3.3 would otherwise resolve on its own — that's
# intentional, not a typo. Re-test `expo export` on ios/android/web before
# bumping it.
overrides:
  lightningcss: 1.30.1
